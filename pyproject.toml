[project]
name = "ridely"
version = "0.1.0"
description = "Ridely: a text agent that helps Princeton older adults and residents with disabilities find free or low-cost rides"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-ai-slim[openai]>=2.68.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
