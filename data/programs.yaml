- id: access_link
  name: NJ Transit Access Link
  operator: NJ Transit
  summary: ADA paratransit for people whose disability stops them from using local buses. Needs approval first. Near NJ Transit bus routes only.
  eligibility:
    rule: access_link
    disability_any_age: true
    needs_registration: true
  area:
    kind: near_bus_routes   # ~3/4 mile from NJ Transit local bus routes, during bus hours
  cost: "Low fare, at most 2 times the bus fare (VERIFY exact fare)."
  booking:
    phone: "973-491-4224"
    phone_note: "Press option 2 for reservations. To apply, call and ask for an eligibility interview."
    hours: "VERIFY"
    notice: {kind: calendar_days, value: 1}   # VERIFY: NJ Transit has proposed changing the booking window
    max_advance_days: null
  how_to_register: "Call NJ Transit Access Link and ask to apply. They do a phone interview about how your disability affects bus use."
  what_to_say: "I am approved for Access Link (or: I want to apply). I want to book a ride on <date> at <time> from <pickup> to <destination>."
  verified: false
  last_verified: "2026-11-13 (web only)"
  sources:
    - https://njtransit.com/accessibility/access-link-ada-paratransit
    - https://nj.gov/disabilities/employment-independent-living/transportation/request-a-ride.shtml

