# Ridely program data. Made from data/programs.md (the human-readable master rules).
# Rule: when you change a fact here, change it in programs.md too, and update last_verified.
# verified: false  -> sources disagree or are old. Ridely tells the user to confirm.
#
# eligibility.rule names a function in ridely/tools/eligibility.py. The numbers here feed it.
# area.kind: towns | counties | state | near_bus_routes
# notice.kind: business_days | calendar_days | none

- id: crosstown
  name: Crosstown
  operator: Center for Modern Aging Princeton (CMAP), rides by GMTMA RideProvide
  summary: Low-cost rides for registered older Princeton residents. Free to Penn Medicine Princeton Medical Center.
  eligibility:
    rule: crosstown
    home_towns: [Princeton]
    min_age: 65            # VERIFY: no source gives the Crosstown age rule; 65 comes from RideProvide.
    visually_impaired_any_age: true
    needs_registration: true
  area:
    kind: towns
    towns: [Princeton]
    extra_destinations: [penn_medicine_princeton, princeton_fitness_wellness]
  cost: "$3 per one-way ride (voucher). Free to Penn Medicine Princeton Medical Center and to Princeton Fitness & Wellness for medical rehab."
  booking:
    phone: "609-751-9699"
    phone_note: "Center for Modern Aging Princeton. One listing gives 609-924-7108."
    hours: "Weekdays, office hours (VERIFY)"
    notice: {kind: business_days, value: 3}   # VERIFY: sources say "a few days".
    max_advance_days: null
  how_to_register: "Call the Center for Modern Aging Princeton and ask to register for Crosstown."
  what_to_say: "I am a Princeton resident and I want to book a Crosstown ride. My ride is on <date> at <time>, from <pickup> to <destination>."
  verified: false
  last_verified: "2026-11-13 (web only)"
  sources:
    - https://benefitscheckup.org/program/nj_princeton_princeton_senior_resour
    - https://www.towntopics.com/2025/06/11/center-for-modern-aging-looks-back-with-pride-ahead-with-optimism/

- id: rideprovide
  name: RideProvide
  operator: Greater Mercer Transportation Management Association (GMTMA)
  summary: Door-to-door rides for adults 65+ and visually impaired adults in Mercer County, Plainsboro and south Montgomery. Yearly membership plus a fare by zone. Free to Penn Medicine Princeton Health and RWJ Hamilton.
  eligibility:
    rule: rideprovide
    min_age: 65
    visually_impaired_any_age: true
    home_counties: [Mercer]
    home_towns: [Plainsboro, Montgomery]   # only the southern part of Montgomery
    needs_registration: true
  area:
    kind: counties
    counties: [Mercer]
    towns: [Plainsboro, Montgomery]   # only the southern part of Montgomery
    extra_destinations: [penn_medicine_princeton, princeton_fitness_wellness, rwj_hamilton]
  cost: "Membership $40 per year (one person) or $60 (family), then a pre-paid account. Fare each way: $9 in one zone (about one town), $13.50 to a neighboring zone, $19 to a third zone, $22.50 farther. 15% off shared rides. $5 extra before 8 am. Free to Penn Medicine Princeton Health places and RWJ Hamilton. No tips."
  booking:
    phone: "609-452-5144"
    phone_note: "Reservations: 609-452-5144. Membership application and questions: 609-452-5140. Email info@rideprovide.org. Website rideprovide.org"
    hours: "Office Monday to Friday 8:30 am to 4:30 pm. Rides Monday to Friday 8 am to 5 pm. Closed on holidays."
    notice: {kind: business_days, value: 2}   # by phone; online booking needs 3 business days
    max_advance_days: null
  how_to_register: "Call 609-452-5140 for a membership application. After you join, set up a pre-paid account. Then call 609-452-5144 to book."
  what_to_say: "I am a RideProvide member (or: I want to join). I want to book a ride on <date> at <time>, from <pickup> to <destination>."
  verified: false
  last_verified: "2026-11-13 (rideprovide.org/our-service page)"
  sources:
    - https://rideprovide.org/our-service/
    - https://gmtma.org/senior-programs/

- id: trade
  name: Mercer County TRADE
  operator: Mercer County (TRADE Division)
  summary: Free rides for Mercer County residents age 60+ or with a disability. Book at least one week ahead.
  eligibility:
    rule: trade
    min_age: 60
    disability_any_age: true
    home_counties: [Mercer]
    needs_registration: true
  area:
    kind: counties
    counties: [Mercer]   # VERIFY: out-of-county medical trips
  cost: "Free. Donations accepted."
  booking:
    phone: "609-530-1971"
    phone_note: "Calls often go to voicemail. Leave a message with your name and phone number."
    hours: "Weekdays (VERIFY hours)"
    notice: {kind: calendar_days, value: 7}   # VERIFY: one source says up to 14 days ahead
    max_advance_days: 14
  how_to_register: "You can register by phone when you book your first ride."
  what_to_say: "I am a Mercer County resident, age 60 or older (or: I have a disability). I want to book a TRADE ride on <date> at <time> to <destination address and phone>. My return time is <time>."
  verified: false
  last_verified: "2026-11-13 (web only)"
  sources:
    - https://www.mercercounty.org/departments/human-services/aging-disability-resource-connection/trade-division/faqs
    - https://search.nj211.org/search/b3fc70b4-aa60-509f-924e-e5adb5dab331

- id: access_link
  name: NJ Transit Access Link
  operator: NJ Transit
  summary: ADA paratransit for people whose disability stops them from using local buses. Needs approval (interview + medical form) first. Only within 3/4 mile of local bus routes, at the same times buses run.
  eligibility:
    rule: access_link
    disability_any_age: true
    needs_registration: true
  area:
    kind: near_bus_routes   # 3/4 mile around NJ Transit local bus routes and light rail, same days and hours as the bus
  cost: "Not free. Fare is based on the local bus fare and the number of zones (ask for the exact amount). Exact cash or EZ-Wallet. A personal care attendant rides free."
  booking:
    phone: "973-491-4224"
    phone_note: "To apply: option 1. Reservations: option 2 (then 1 for tomorrow, 2 for later days). Also online at accesslink.njtransit.com and in the app."
    hours: "Reservations every day: for tomorrow 7:30 am to 4 pm; for later days 7:30 am to 3 pm."
    notice: {kind: calendar_days, value: 1, call_days: daily, cutoff_time: "4:00 pm"}   # no same-day trips
    max_advance_days: null   # not stated; NJ Transit has proposed changing the window
  how_to_register: "Call 973-491-4224, option 1. There is an interview (phone or in person) about how the disability stops you from using the bus, and you need a current medical form."
  what_to_say: "I am approved for Access Link (or: I want to apply). I want to book a ride on <date> at <time> from <pickup> to <destination>."
  verified: false
  last_verified: "2026-11-13 (njtransit.com Access Link pages)"
  sources:
    - https://njtransit.com/accessibility/access-link-ada-paratransit
    - https://njtransit.com/accesslinkqanda

