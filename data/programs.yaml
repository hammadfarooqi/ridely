# Ridely program data. Made from data/programs.md (the human-readable master rules).
# Rule: when you change a fact here, change it in programs.md too, and update last_verified.
# verified: false  -> sources disagree or are old. Ridely tells the user to confirm.
#
# eligibility.rule names a function in ridely/tools/eligibility.py. The numbers here feed it.
# area.kind: towns | counties | state | near_bus_routes
# notice.kind: business_days | calendar_days | none

- id: crosstown
  name: Crosstown
  operator: Center for Modern Aging Princeton (CMAP), rides by GMTMA RideProvide
  summary: Low-cost rides for registered older Princeton residents. Free to Penn Medicine Princeton Medical Center.
  eligibility:
    rule: crosstown
    home_towns: [Princeton]
    min_age: 65            # VERIFY: no source gives the Crosstown age rule; 65 comes from RideProvide.
    visually_impaired_any_age: true
    needs_registration: true
  area:
    kind: towns
    towns: [Princeton]
    extra_destinations: [penn_medicine_princeton, princeton_fitness_wellness]
  cost: "$3 per one-way ride (voucher). Free to Penn Medicine Princeton Medical Center and to Princeton Fitness & Wellness for medical rehab."
  booking:
    phone: "609-751-9699"
    phone_note: "Center for Modern Aging Princeton. One listing gives 609-924-7108."
    hours: "Weekdays, office hours (VERIFY)"
    notice: {kind: business_days, value: 3}   # VERIFY: sources say "a few days".
    max_advance_days: null
  how_to_register: "Call the Center for Modern Aging Princeton and ask to register for Crosstown."
  what_to_say: "I am a Princeton resident and I want to book a Crosstown ride. My ride is on <date> at <time>, from <pickup> to <destination>."
  verified: false
  last_verified: "2026-11-13 (web only)"
  sources:
    - https://benefitscheckup.org/program/nj_princeton_princeton_senior_resour
    - https://www.towntopics.com/2025/06/11/center-for-modern-aging-looks-back-with-pride-ahead-with-optimism/

