    min_age: 65
    visually_impaired_any_age: true
    home_counties: [Mercer]
    home_towns: [Plainsboro, Montgomery]
    needs_registration: true
  area:
    kind: counties
    counties: [Mercer]
    towns: [Plainsboro, Montgomery]
  cost: "Membership $40 per year (one person) or $60 per year (couple). Each ride has a fare based on zones (VERIFY prices)."
  booking:
    phone: "609-452-5144"
    phone_note: "Some sources give 609-452-5140. Website: rideprovide.org"
    hours: "Monday to Friday, 8:30 am to 4:30 pm"
    notice: {kind: business_days, value: 3}   # VERIFY
    max_advance_days: null
  how_to_register: "Call RideProvide and ask to become a member. Members can then book rides."
  what_to_say: "I want to become a RideProvide member (or: I am a member) and book a ride on <date> at <time>, from <pickup> to <destination>."
